[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "voxscribe"
version = "0.1.0"
description = "Transcribe voice notes (WhatsApp .opus, .mp3, .m4a, ...) locally with whisper.cpp."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "SanYann" }]
keywords = ["whisper", "transcription", "speech-to-text", "voice-notes", "opus", "whatsapp", "offline"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=1.2.0"]

[project.urls]
Homepage = "https://github.com/SanYann/voxscribe"
Issues = "https://github.com/SanYann/voxscribe/issues"

[project.scripts]
voxscribe = "voxscribe.cli:main"
voxscribe-mcp = "voxscribe.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/voxscribe"]
